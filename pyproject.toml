[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-agent-mvp"
version = "0.1.0"
description = "Generic Phase 1 image agent core with offline human approval gates."
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6,<3",
  "PyYAML>=6.0,<7",
  "openai>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "jsonschema>=4.0,<5",
]

[project.scripts]
image-agent = "workspace_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_core*", "interaction*", "storage*", "prompt_engine*", "skills*", "model_router*", "render_clients*", "calibrator*", "review*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
