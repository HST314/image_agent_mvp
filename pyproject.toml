[build-system]
requires = ["setuptools>=68", "tomli>=2.0; python_version < '3.11'"]
build-backend = "setuptools.build_meta"

[project]
name = "image-agent-mvp"
version = "1.7.6"
description = "Generic Phase 1 image agent core with offline human approval gates."
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6,<3",
  "PyYAML>=6.0,<7",
  "openai>=1.0,<2",
  "Pillow>=10.0,<13",
  "fastapi>=0.110,<1",
  "portalocker>=2.8,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "jsonschema>=4.0,<5",
]

[project.scripts]
image-agent = "workspace_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_core*", "interaction*", "storage*", "prompt_engine*", "skills*", "model_router*", "render_clients*", "calibrator*", "review*", "configs*", "schemas*", "examples*", "frontend*"]

[tool.setuptools]
py-modules = ["workspace_cli", "main", "main_front", "diagnostics"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json", "*.md", "*.html"]
frontend = ["static/css/*.css", "static/js/*.js"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "frontend_tests"]
markers = ["browser: real browser end-to-end release gate"]
