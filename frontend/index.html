<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#6d28d9">
  <title>Image Agent Studio</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <div class="app" id="app">
    <!-- T1 布局总框架：顶部导航栏（工作区/状态/设置 + 工程名·分支标识），无汉堡按钮 -->
    <header class="topnav">
      <div class="topnav__brand"><div class="brand__mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" d="M5 19 19 5M7 5h12v12M5 9v10h10"/></svg></div><strong>Image Agent</strong></div>
      <nav class="topnav__tabs" aria-label="主导航">
        <button type="button" class="topnav__tab" data-view="workspace" aria-current="page">工作区</button>
        <button type="button" class="topnav__tab" data-view="status">状态</button>
        <button type="button" class="topnav__tab" data-view="settings">设置</button>
      </nav>
      <div class="topnav__context">
        <span class="topnav__project" id="topnav-project" hidden><strong id="topnav-project-name"></strong><span class="badge badge--info" id="topnav-branch">分支 main</span></span>
        <button class="btn btn--secondary" id="refresh-button" aria-label="刷新"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6v5h-5M4 18v-5h5M18.5 9A7 7 0 0 0 6 6.5L4 11m16 2-2 4.5A7 7 0 0 1 5.5 15"/></svg><span>刷新</span></button>
        <button class="btn btn--primary" id="new-button" aria-label="新建工程"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>新建工程</span></button>
      </div>
    </header>
    <div class="app-body">
      <!-- 左侧项目目录栏：默认收成窄条只留图标，悬停或点击展开（Q1-A） -->
      <aside class="sidebar" id="sidebar" aria-label="工程导航">
        <button type="button" class="sidebar__toggle" id="sidebar-toggle" aria-expanded="false" aria-label="展开或收起工程目录"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
        <p class="sidebar__title">最近工程</p><nav id="project-list" class="project-list" aria-label="工程列表"><div class="sidebar__empty">正在读取工程…</div></nav>
        <div class="sidebar__footer"><div class="system-state"><span class="dot" id="health-dot"></span><span id="health-text">正在连接服务</span></div></div>
      </aside>
      <main class="main" id="main" tabindex="-1">
        <div class="content" id="content" aria-live="polite"></div>
      </main>
    </div>
  </div>
  <div class="toast-region" id="toasts" aria-live="polite" aria-atomic="true"></div>

  <dialog class="dialog" id="project-dialog" aria-labelledby="dialog-title">
    <form id="project-form">
      <div class="dialog__head"><h2 id="dialog-title">新建创作工程</h2><button type="button" class="icon-btn" data-close aria-label="关闭对话框"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
      <div class="dialog__body">
        <p class="hint"><strong>调试入口</strong>：一期保留手工下发任务（ImageTaskCard JSON），用于契约联调；正式环境由主 Agent 自动下发。</p>
        <div class="field"><label for="project-id">工程 ID <span aria-hidden="true">*</span></label><input class="input" id="project-id" name="project_id" required minlength="2" maxlength="64" pattern="[A-Za-z0-9][A-Za-z0-9_-]{1,63}" placeholder="campaign-visual-01" aria-describedby="project-help project-error"><small id="project-help">使用字母、数字、下划线或连字符，创建后不可更改。</small><div class="field-error" id="project-error" role="alert"></div></div>
        <div class="field"><label for="task-json">ImageTaskCard JSON <span aria-hidden="true">*</span></label><textarea class="input" id="task-json" name="task_json" required spellcheck="false" aria-describedby="task-help task-error"></textarea><small id="task-help">必须符合生产后端 ImageTaskCard 契约，最多 512 KiB。</small><div class="field-error" id="task-error" role="alert"></div></div>
        <label class="switch-row"><input type="checkbox" id="offline"><span><strong>显式离线测试模式</strong><span>使用模拟图片验证流程；模拟结果不能最终交付。</span></span></label>
      </div>
      <div class="dialog__foot"><button type="button" class="btn btn--secondary" data-close>取消</button><button type="submit" class="btn btn--primary" id="create-button">创建并启动</button></div>
    </form>
  </dialog>

  <!-- 未知付费调用处置条目模板：JS 按条克隆并写入 trace_id 与幂等键。 -->
  <template id="tpl-unknown-action">
    <div class="hint unknown-action">
      <code class="unknown-action__trace"></code>
      <p class="unknown-action__note">结果未知，可能已计费；不会自动重试。</p>
      <div class="button-row">
        <button type="button" class="btn btn--secondary" data-unknown="retry_after_confirmation">确认后重试</button>
        <button type="button" class="btn btn--danger" data-unknown="abandon">放弃调用</button>
      </div>
    </div>
  </template>

  <!-- 运行策略修订模板：确认后总是创建新分支，旧分支保持不变。 -->
  <template id="tpl-policy-section">
    <section class="panel section policy-section">
      <div class="section__head"><div><h3>运行策略</h3><p>修改策略会创建新分支，仅影响该分支后续运行；旧分支保持不变。</p></div></div>
      <dl class="kv policy-section__values"></dl>
      <button type="button" class="btn btn--secondary" data-revise-policy>确认并修订策略</button>
    </section>
  </template>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
