<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#6d28d9">
  <title>Image Agent 创作工作台</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <div class="app" id="app">
    <header class="topnav">
      <div class="topnav__brand"><div class="brand__mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" d="M5 19 19 5M7 5h12v12M5 9v10h10"/></svg></div><strong>Image Agent</strong></div>
      <nav class="topnav__tabs" aria-label="主导航">
        <button type="button" class="topnav__tab" data-view="workspace" aria-current="page">工作区</button>
        <button type="button" class="topnav__tab" data-view="settings">当前任务设置</button>
        <button type="button" class="topnav__tab topnav__status-tab" data-view="status">状态<span class="topnav__alert-dot" id="status-alert" aria-label="存在需要处理的异常" hidden></span></button>
      </nav>
      <div class="topnav__context">
        <span class="topnav__project" id="topnav-project" hidden><strong id="topnav-project-name"></strong><button type="button" class="badge badge--info topnav__branch" id="topnav-branch" title="查看并切换分支">分支 main</button></span>
        <button class="btn btn--secondary" id="refresh-button" aria-label="刷新"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6v5h-5M4 18v-5h5M18.5 9A7 7 0 0 0 6 6.5L4 11m16 2-2 4.5A7 7 0 0 1 5.5 15"/></svg><span>刷新</span></button>
        <!-- standalone-create-action-start --><button class="btn btn--primary" id="new-button" aria-label="新建工程"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>新建工程</span></button><!-- standalone-create-action-end -->
      </div>
    </header>
    <div class="app-body">
      <!-- standalone-create-sidebar-start -->
      <!-- 左侧项目目录栏仅属于独立模式；受管模式由主系统统一导航。 -->
      <aside class="sidebar" id="sidebar" aria-label="工程导航">
        <button type="button" class="sidebar__toggle" id="sidebar-toggle" aria-expanded="false" aria-label="展开或收起工程目录"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
        <p class="sidebar__title">最近工程</p><nav id="project-list" class="project-list" aria-label="工程列表"><div class="sidebar__empty">正在读取工程…</div></nav>
        <div class="sidebar__footer"><div class="system-state"><span class="dot" id="health-dot"></span><span id="health-text">正在连接服务</span></div></div>
      </aside>
      <!-- standalone-create-sidebar-end -->
      <main class="main" id="main" tabindex="-1">
        <div class="content" id="content" aria-live="polite"></div>
      </main>
    </div>
  </div>
  <div class="toast-region" id="toasts" aria-live="polite" aria-atomic="true"></div>

  <!-- standalone-create-dialog-start --><dialog class="dialog" id="project-dialog" aria-labelledby="dialog-title">
    <form id="project-form">
      <div class="dialog__head"><h2 id="dialog-title">新建创作工程</h2><button type="button" class="icon-btn" data-close aria-label="关闭对话框"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
      <div class="dialog__body">
        <p class="hint"><strong>描述创作需求</strong>：填写面向创作的信息，系统会自动整理为任务卡并进入澄清流程。</p>
        <div class="field"><label for="project-id">工程 ID <span aria-hidden="true">*</span></label><input class="input" id="project-id" name="projectCode" required minlength="2" maxlength="64" pattern="[A-Za-z0-9][A-Za-z0-9_-]{1,63}" placeholder="campaign-visual-01" aria-describedby="project-help project-error"><small id="project-help">使用字母、数字、下划线或连字符，创建后不可更改。</small><div class="field-error" id="project-error" role="alert"></div></div>
        <div class="field"><label for="creative-goal">创作目标 <span aria-hidden="true">*</span></label><textarea class="input" id="creative-goal" name="creativeGoal" required aria-describedby="goal-help task-error" placeholder="例如：设计一张突出新品轻盈质感的社交媒体海报"></textarea><small id="goal-help">说明要创作的内容、主体与希望传达的重点。</small></div>
        <div class="create-form-grid">
          <div class="field"><label for="usage-scene">使用场景 <span aria-hidden="true">*</span></label><input class="input" id="usage-scene" name="usageScene" required placeholder="例如：社交媒体发布"></div>
          <div class="field"><label for="target-group">目标人群</label><input class="input" id="target-group" name="targetGroup" placeholder="例如：20–35 岁城市通勤人群"></div>
          <div class="field"><label for="style-tone">风格与语气</label><input class="input" id="style-tone" name="styleTone" placeholder="例如：清爽、现代、有活力"></div>
          <div class="field"><label for="delivery-spec">交付规格</label><input class="input" id="delivery-spec" name="deliverySpec" placeholder="例如：正方形图片；可留空待澄清"></div>
        </div>
        <div class="field-error" id="task-error" role="alert" aria-live="polite"></div>
      </div>
      <div class="dialog__foot"><button type="button" class="btn btn--secondary" data-close>取消</button><button type="submit" class="btn btn--primary" id="create-button">创建并启动</button></div>
    </form>
  </dialog><!-- standalone-create-dialog-end -->

  <!-- 未知付费调用处置条目模板：JS 按条克隆并写入 trace_id 与幂等键。 -->
  <template id="tpl-unknown-action">
    <div class="hint unknown-action">
      <code class="unknown-action__trace"></code>
      <p class="unknown-action__note">结果未知，可能已计费；不会自动重试。</p>
      <div class="button-row">
        <button type="button" class="btn btn--secondary" data-unknown="retry_after_confirmation">确认后重试</button>
        <button type="button" class="btn btn--danger" data-unknown="abandon">放弃调用</button>
      </div>
    </div>
  </template>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
